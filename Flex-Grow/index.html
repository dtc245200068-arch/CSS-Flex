<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-grow Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Thực hành CSS flex-grow Property</h1>

    <p>
        Div thứ 2 được áp dụng flex-grow: 3 nên sẽ phát triển
        lớn hơn các div còn lại.
    </p>

    <div class="container">
        <div class="item">Div 1</div>
        <div class="item grow">Div 2</div>
        <div class="item">Div 3</div>
        <div class="item">Div 4</div>
        <div class="item">Div 5</div>
    </div>

</body>
</html>
