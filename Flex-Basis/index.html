<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-basis Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Thực hành CSS flex-basis Property</h1>

    <h2>Ví dụ 1: flex-basis với giá trị độ dài</h2>

    <div class="container">
        <div class="item item1">100px</div>
        <div class="item item2">200px</div>
        <div class="item item3">300px</div>
    </div>

    <h2>Ví dụ 2: auto, initial và inherit</h2>

    <div class="container example2">
        <div class="item auto">auto</div>
        <div class="item initial">initial</div>

        <div class="parent">
            <div class="item inherit">inherit</div>
        </div>
    </div>

</body>
</html>
